# Frontend seul : le backend est une application Compose indépendante
# (`supabase-project/docker-compose.yml` + son override Traefik). Les deux ne
# sont jamais démarrés par le même fichier.
#
#   cp .env.app.example .env.app    # puis renseigner URL et clé publiable
#   GIT_SHA="$(git rev-parse HEAD)" docker compose --env-file .env.app -f compose.app.yaml config
#   GIT_SHA="$(git rev-parse HEAD)" docker compose --env-file .env.app -f compose.app.yaml up -d --build --wait
#
# Le SHA se calcule par le shell à CHAQUE build : Compose n'exécute PAS les
# substitutions shell (un `$(git …)` écrit ici passerait littéralement), et le
# `--build` est obligatoire — `up -d` ne reconstruit rien, ni à un changement
# d'argument ni à un changement de contexte (mesuré sur Compose v5.6.0) :
# sans lui, l'estampille ne se republierait jamais.
#
# TLS est terminé par Traefik sur le réseau externe `frontend` : ce service
# n'ouvre aucun port sur l'hôte.

services:
  ensemble-organises-app:
    build:
      context: ./app
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        # Compose transmet TOUJOURS cet argument, VIDE quand `GIT_SHA` est
        # absente de l'environnement : le `${…:-}` évite l'avertissement
        # d'interpolation et laisse une chaîne vide, que chaque expansion
        # `${GIT_SHA:-unknown}` du Dockerfile convertit en `unknown`.
        GIT_SHA: ${GIT_SHA:-}
    container_name: ensemble-organises-app
    security_opt:
      - no-new-privileges:true
    # Journaux techniques (politique §6 : 1 mois maximum) : garde-fou par
    # taille ici, borne temporelle par logrotate (voir
    # supabase-project/logrotate-docker).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eo-app-rtr.entrypoints=https"
      # Hôte servi par le frontend. DOIT être identique à l'hôte de SITE_URL
      # dans supabase-project/.env : c'est là que le backend renvoie après une
      # confirmation de courriel ou une redirection OAuth. Voir
      # scripts/check-hosts.sh, qui vérifie la correspondance.
      - "traefik.http.routers.eo-app-rtr.rule=Host(`${EO_APP_HOST:-app.votredomaine.fr}`)"
      - "traefik.http.routers.eo-app-rtr.service=eo-app-svc"
      - "traefik.http.services.eo-app-svc.loadbalancer.server.port=8080"
      - "traefik.docker.network=frontend"

networks:
  frontend:
    external: true
