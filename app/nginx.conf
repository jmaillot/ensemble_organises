# PWA servie par React Router : les assets versionnés sont mis en cache longue
# durée, le service worker et le manifeste sont revalidés à chaque visite pour
# que l'application se mette à jour sans intervention.
#
# HSTS, Content-Security-Policy et Permissions-Policy sont posés au niveau
# Traefik, après validation des domaines OAuth, Storage, Realtime et du service
# worker. Ne pas les dupliquer ici.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Estampille de build : la valeur est substituée au moment du build depuis
    # l'unique `ARG GIT_SHA` (placeholder `__APP_GIT_SHA__` remplacé par le
    # `sed` du Dockerfile) ; une valeur écrite là en dur mentirait dès le
    # prochain build. L'en-tête va au niveau `server` ET JAMAIS dans une
    # location : une seule `add_header` déclarée dans un bloc `location`
    # annule l'héritage de TOUTES les `add_header` du niveau englobant (règle
    # nginx : héritage « if and only if there are no add_header directives
    # defined on the current level ») — elle ferait perdre les trois en-têtes
    # de sécurité ci-dessus à la location qui la porterait.
    add_header X-App-Version "__APP_GIT_SHA__" always;

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    # Preuve au `curl`, sans JavaScript : sans cette location dédiée,
    # `location /` répondrait 200 + `index.html` si le fichier manquait — un
    # succès muet qui ressemblerait à une estampille. `try_files $uri =404`
    # rend l'absence visible. AUCUN `add_header` ici : le niveau `server`
    # (dont `X-App-Version` et les en-têtes de sécurité) reste hérité —
    # `expires` n'est pas un `add_header`, il pose directement
    # `Cache-Control: no-cache` et n'annule pas l'héritage.
    # `Content-Type: application/json` est déjà déduit de l'extension `.json`
    # par `mime.types` de l'image épinglée : rien à ajouter.
    location = /version.json {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Pages légales pré-rendues (vérification OAuth Google, robots sans
    # JavaScript) : servies en fichier direct, avec ou sans slash final, sans
    # redirection ni repli vers index.html. Sources :
    # app/public/confidentialite/index.html et
    # app/public/conditions-utilisation/index.html.
    location ~ ^/(confidentialite|conditions-utilisation)/?$ {
        expires -1;
        try_files /$1/index.html =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
