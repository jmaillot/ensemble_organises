# PWA servie par React Router : les assets versionnés sont mis en cache longue
# durée, le service worker et le manifeste sont revalidés à chaque visite pour
# que l'application se mette à jour sans intervention.
#
# HSTS, Content-Security-Policy et Permissions-Policy sont posés au niveau
# Traefik, après validation des domaines OAuth, Storage, Realtime et du service
# worker. Ne pas les dupliquer ici.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
